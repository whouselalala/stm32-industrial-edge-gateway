<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux 工业边缘网关</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
  body { margin: 2rem auto; padding: 0 1rem; max-width: 55rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1.25rem; }
  dd { margin: 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<main>
<h1>Linux 工业边缘网关</h1>
<p id="status" role="status">正在读取网关状态</p>
<dl>
  <dt>数据来源</dt><dd id="source">—</dd>
  <dt>采集时间</dt><dd id="time">—</dd>
  <dt>温度</dt><dd id="temp">—</dd>
  <dt>相对湿度</dt><dd id="humi">—</dd>
  <dt>光照</dt><dd id="light">—</dd>
  <dt>待确认记录</dt><dd id="pending">—</dd>
  <dt>队列满丢弃（本次启动）</dt><dd id="rejected">—</dd>
</dl>
<h2>最近运行日志</h2>
<pre id="logs"></pre>
</main>
<script>
const put = (id, value) => { document.getElementById(id).textContent = value; };
const reading = (value, unit) => value == null ? '—' : value + ' ' + unit;
async function refresh() {
  try {
    const response = await fetch('/api/status', { signal: AbortSignal.timeout(3000) });
    if (!response.ok) throw Error(response.status);
    const data = await response.json();
    const sample = data.latest;
    put('status', data.mqtt_online ? 'MQTT 在线' : 'MQTT 离线');
    put('source', data.simulated ? '模拟数据' : 'RS485 实机');
    put('time', sample ? new Date(sample.timestamp).toLocaleString() : '—');
    put('temp', reading(sample?.temp, '°C'));
    put('humi', reading(sample?.humi, '%RH'));
    put('light', reading(sample?.light, 'lx'));
    put('pending', data.pending);
    put('rejected', data.queue_rejected_since_start);
    put('logs', data.logs.join('\n'));
  } catch {
    put('status', '监控连接中断 · 当前显示上次读取的数据');
  } finally {
    setTimeout(refresh, 2000);
  }
}
refresh();
</script>
